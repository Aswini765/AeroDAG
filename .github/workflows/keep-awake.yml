name: Keep AeroDAG awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        run: curl -fsS --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://aerodag.onrender.com/ || true
